services:
  coturn:
    image: coturn/coturn:4.6.2
    command:
      - -n
      - --log-file=stdout
      - --verbose
      - --no-cli
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=example.org
      - --lt-cred-mech
      - --user=test:secret
      # Common hardening (and what public TURN providers enforce): never relay to private networks.
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

  repro:
    build:
      context: .
      args:
        ICE4J_VERSION: ${ICE4J_VERSION:-3.2-17-geea6cd3}
    depends_on:
      - coturn
    environment:
      TURN_HOST: coturn
      TURN_USER: test
      TURN_PASSWORD: secret
      REMOTE_CANDIDATE_IP: 10.1.2.3
      DURATION_SECONDS: ${DURATION_SECONDS:-10}
